[package]
edition = { workspace = true }
include = { workspace = true }
license = { workspace = true }
name = "froglight-brigadier"
readme = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

# --- Dependencies ---

[dev-dependencies]
bevy = { features = ["bevy_log"], workspace = true }

[dependencies]
bevy_app = { features = ["bevy_reflect", "reflect_functions"], workspace = true }
bevy_ecs = { features = ["bevy_reflect", "reflect_functions"], workspace = true }
bevy_reflect = { workspace = true }
froglight-common = { features = ["bevy", "indexmap"], workspace = true }
lexical = { features = ["format", "parse"], workspace = true }
variadics_please = { workspace = true }

# Optional dependencies
tracing = { workspace = true, optional = true }

# --- Tests/Benchmarks ---

[[test]]
name = "basic"
required-features = ["tracing"]

# --- Features ---

[features]
default = ["std"]

# Enable `glam` support.
glam = ["froglight-common/glam"]
# Enable `tracing` support.
tracing = ["dep:tracing"]
# Enable `uuid` support.
uuid = ["froglight-common/uuid"]

# Enable `libm` for `no_std` support.
libm = ["froglight-common/libm"]

# Enable support for the standard library
std = ["bevy_app/std", "bevy_ecs/std", "bevy_reflect/std", "froglight-common/std", "lexical/std"]
# Enable optimizations using the nightly toolchain
nightly = ["froglight-common/nightly"]
