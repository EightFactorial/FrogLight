[package]
edition = { workspace = true }
include = { workspace = true }
license = { workspace = true }
name = "froglight-common"
readme = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

# --- Dependencies ---

[dependencies]
bevy_reflect = { workspace = true, optional = true }
critical-section = { workspace = true, optional = true }
facet = { workspace = true, optional = true }
foldhash = { workspace = true, optional = true }
froglight-facet = { workspace = true, optional = true }
glam = { workspace = true, optional = true }
indexmap = { workspace = true, optional = true }
libm = { workspace = true, optional = true }
once_cell = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
serde = { features = ["derive"], workspace = true, optional = true }
uuid = { workspace = true, optional = true }

# --- Features ---

[features]
default = ["std"]

# Enable `bevy` support.
bevy = ["alloc", "dep:bevy_reflect"]
# Enable `facet` support.
facet = ["dep:facet"]
# Enable `froglight-facet` support.
froglight-facet = ["dep:froglight-facet", "facet"]
# Enable `serde` support.
serde = ["dep:serde", "glam?/serde", "indexmap?/serde", "parking_lot?/serde", "uuid?/serde"]

# Enable `indexmap` support.
indexmap = ["alloc", "dep:indexmap", "dep:foldhash", "facet?/indexmap"]
# Enable `glam`.
glam = ["dep:glam"]
# Enable `parking_lot`.
parking_lot = ["dep:parking_lot", "facet?/lock_api", "once_cell?/parking_lot"]
# Enable `uuid` support.
uuid = ["bevy_reflect?/uuid", "dep:uuid", "facet?/uuid"]

# Enable `critical-section` for `no_std` support.
critical-section = ["dep:critical-section", "once_cell?/critical-section"]
# Enable `libm` for `no_std` support.
libm = ["dep:libm", "glam?/nostd-libm"]
# Enable `once_cell` for `no_std` support.
once_cell = ["dep:once_cell"]

# Enable support for a global allocator
alloc = ["facet?/alloc", "once_cell?/alloc", "serde?/alloc"]
# Enable support for the standard library
std = ["alloc", "bevy_reflect?/std", "critical-section?/std", "facet?/std", "foldhash?/std", "froglight-facet?/std", "glam?/std", "indexmap?/std", "once_cell?/std", "uuid?/std"]
# Enable optimizations using the nightly toolchain
nightly = ["foldhash?/nightly", "froglight-facet?/nightly", "parking_lot?/nightly"]

# -------------------------------------------------------------------------------------------------
# Note: The following features are automatically @generated.

v26_1 = []
v26_2 = []
