[package]
edition = { workspace = true }
include = { workspace = true }
license = { workspace = true }
name = "froglight-math"
readme = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

# --- Dependencies ---

[dev-dependencies]
glam = { workspace = true }

[dependencies]
froglight-common = { features = ["glam"], workspace = true }

# --- Features ---

[features]
default = ["std"]

# Enable `glam` for `no_std` support.
critical-section = ["froglight-common/critical-section"]
# Enable `libm` for `no_std` support.
libm = ["froglight-common/libm"]
# Enable `once_cell` for `no_std` support.
once_cell = ["froglight-common/once_cell"]

# Enable support for a global allocator
alloc = ["froglight-common/alloc"]
# Enable support for the standard library
std = ["alloc", "froglight-common/std"]
# Enable optimizations using the nightly toolchain
nightly = ["froglight-common/nightly"]
