[package]
edition = { workspace = true }
include = { workspace = true }
license = { workspace = true }
name = "froglight-mutf8"
readme = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

# --- Dependencies ---

[dev-dependencies]
cesu8 = { version = "1.1" }
criterion = { features = ["default", "html_reports"], workspace = true }
pretty_assertions = { features = ["std"], workspace = true }
rand = { workspace = true }
simd_cesu8 = { features = ["default"], version = "1.1" }

[dependencies]
simdutf8 = { workspace = true }
fearless_simd = { workspace = true }
memchr = { workspace = true }

# Optional dependencies
facet = { workspace = true, optional = true }
froglight-facet = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[target.'cfg(target_arch = "aarch64")'.dependencies]
simdutf8 = { features = ["aarch64_neon"], workspace = true }

# --- Tests/Benchmarks ---

[[bench]]
name = "basic"
required-features = ["std"]
harness = false

[[bench]]
name = "comparison"
required-features = ["std"]
harness = false

[[test]]
name = "static_mutf8"

[[test]]
name = "verify_cesu8"
required-features = ["std"]

[[test]]
name = "verify_simd_cesu8"
required-features = ["std"]

# --- Features ---

[features]
default = ["std"]

# Enable `facet` support.
facet = ["alloc", "dep:facet"]
# Enable `froglight-facet` support.
froglight-facet = ["alloc", "dep:froglight-facet", "facet"]
# Enable `tracing` support.
tracing = ["dep:tracing"]

# Enable `libm` for `no_std` support.
libm = ["fearless_simd/libm"]

# Enable support for a global allocator
alloc = ["facet?/alloc", "memchr/alloc"]
# Enable support for the standard library
std = ["alloc", "facet?/std", "fearless_simd/std", "froglight-facet?/std", "memchr/std", "simdutf8/std", "tracing?/std"]
# Enable optimizations using the nightly toolchain
nightly = ["froglight-facet?/nightly", "simdutf8/aarch64_neon_prefetch", "simd_cesu8/nightly"]
