[package]
edition = { workspace = true }
include = { workspace = true }
license = { workspace = true }
name = "froglight-registry"
readme = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

# --- Dependencies ---

[dependencies]
froglight-common = { features = ["indexmap"], workspace = true }
froglight-nbt = { workspace = true }
froglight-registry-template = { workspace = true }

# --- Features ---

[features]
default = ["std"]

# Enable `once_cell` for `no_std` support.
once_cell = ["froglight-common/once_cell"]

# Enable support for the standard library
std = ["froglight-common/std", "froglight-nbt/std"]
# Enable optimizations using the nightly toolchain
nightly = ["froglight-common/nightly", "froglight-nbt/nightly"]

# -------------------------------------------------------------------------------------------------
# Note: The following features are automatically @generated.

v26_1 = ["froglight-common/v26_1"]
v26_2 = ["froglight-common/v26_2"]
