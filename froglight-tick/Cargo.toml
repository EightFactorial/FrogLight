[package]
edition = { workspace = true }
homepage = { workspace = true }
include = { workspace = true }
license = { workspace = true }
name = "froglight-tick"
readme = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

# --- Dependencies ---

[dependencies]
bevy_app = { features = ["bevy_reflect"], workspace = true }
bevy_ecs = { features = ["bevy_reflect"], workspace = true }
bevy_reflect = { workspace = true }
bevy_tasks = { workspace = true }
bevy_time = { features = ["bevy_reflect"], workspace = true }
parking_lot = { workspace = true }

# Optional dependencies
bevy_diagnostic = { workspace = true, optional = true }
froglight-instance = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

# --- Tests/Benchmarks ---

# --- Features ---

[features]
default = ["bevy_diagnostic", "std"]

# Enable `froglight-instance` support.
froglight = ["dep:froglight-instance"]
# Enable `bevy_diagnostic` support.
bevy_diagnostic = ["dep:bevy_diagnostic", "std"]

# Enable `tracing` support.
tracing = ["dep:tracing", "froglight-instance?/tracing"]

# Enable support for the standard library
std = ["bevy_app/std", "bevy_diagnostic?/std", "bevy_ecs/std", "bevy_reflect/std", "bevy_time/std", "froglight-instance?/std", "tracing?/std"]
# Enable optimizations using the nightly toolchain
nightly = ["froglight-instance?/nightly", "parking_lot/nightly"]
